name: Publish Imperii Parusov

on:
  push:
    branches: [main]
    paths:
      - "source-parts/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Assemble original XXVII and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          count=$(find source-parts -maxdepth 1 -name 'part-*.txt' -type f | wc -l)
          test "$count" -eq 26
          cat source-parts/part-*.txt > public/index.html
          echo "16f929033c537c2291776316ae392dde94cb2f8c6c059c307dec66099521fbc3  public/index.html" | sha256sum -c -
          test -s public/index.html
          echo "Source XXVII verified; size $(wc -c < public/index.html) bytes"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
